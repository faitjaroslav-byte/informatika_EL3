site_name: "Informatika EL3"
site_description: Webová učebnice informatiky pro EL3 zaměřená na prezentace, kancelářský software, algoritmizaci a multimediální dokumenty.
site_author: Jaroslav Fait

theme:
  name: material
  language: cs
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Přepnout na tmavý režim
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Přepnout na světlý režim
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Úvod: index.md
  - Kapitoly:
      - 1. Prezentace jako sdělení: cs/01-prezentace-jako-sdeleni.md
      - 2. Publikum, message a příprava: cs/02-publikum-message-a-priprava.md
      - 3. Vizuální příběh a diagramy: cs/03-vizualni-pribeh-a-diagramy.md
      - 4. Data, grafy a důkazy: cs/04-data-grafy-a-dukazy.md
      - 5. Design účinného slidu: cs/05-design-ucinneho-slidu.md
      - 6. Předvedení a týmový projekt: cs/06-predvedeni-a-tymovy-projekt.md
      - 7. Algoritmy, postupy a rozhodování: cs/07-algoritmy-postupy-a-rozhodovani.md
      - 8. Multimediální dokumenty a publikování: cs/08-multimedialni-dokumenty-a-publikovani.md
      - 9. Propojování kancelářských aplikací: cs/09-propojovani-kancelarskych-aplikaci.md
  - Úkoly:
      - 1. Prezentace pozpátku: ukoly/ukol-1-prezentace-pozpatku.md
      - 2. Diagramy a struktury:
          - 00. TechFlow: ukoly/ukol-2-diagramy/00-techflow.md
          - 01. FreshBox: ukoly/ukol-2-diagramy/01-freshbox.md
          - 02. RepairHub: ukoly/ukol-2-diagramy/02-repairhub.md
          - 03. EventLab: ukoly/ukol-2-diagramy/03-eventlab.md
          - 04. EcoWear: ukoly/ukol-2-diagramy/04-ecowear.md
          - 05. MediPoint: ukoly/ukol-2-diagramy/05-medipoint.md
          - 06. GameNest: ukoly/ukol-2-diagramy/06-gamenest.md
